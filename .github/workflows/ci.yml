name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    # The @SpringBootTest slices talk to a real Postgres and a real broker.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d billing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4
        # A non-default user is required: RabbitMQ only accepts `guest` over
        # loopback, and the runner reaches the service through a port mapping.
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s

    # application.yaml carries no credential defaults: locally these come from the
    # gitignored application-secrets.yaml, in CI from here. Throwaway values —
    # they only authenticate against the throwaway services declared above.
    env:
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_USERNAME: ci
      SPRING_RABBITMQ_PASSWORD: ci
      JWT_SECRET: ci-only-signing-key-not-a-real-secret-0123456789-abcdefghijklmnopqrst
      JWT_EXPIRATION: "3600000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 5
