spring:

  data:
    redis:
      host: localhost
      port: 6379

  application:
    name: billing-core-api

  datasource:
    url: jdbc:postgresql://localhost:5432/billing
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080


